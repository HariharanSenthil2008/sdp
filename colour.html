<!DOCTYPE html>
<html>
<head>
    <title>CSS Color Formats</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
        }

        h1 {
            color: black;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .box {
            width: 200px;
            height: 150px;
            border: 2px solid black;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* 1. RGB */
        .rgb {
            background-color: rgb(255, 0, 0);
            color: white;
        }

        /* 2. RGBA */
        .rgba {
            background-color: rgba(255, 0, 0, 0.5);
            color: black;
        }

        /* 3. HSL */
        .hsl {
            background-color: hsl(120, 100%, 50%);
            color: black;
        }

        /* 4. HSLA */
        .hsla {
            background-color: hsla(120, 100%, 50%, 0.5);
            color: black;
        }
    </style>
</head>

<body>

    <h1>RGB vs RGBA vs HSL vs HSLA</h1>

    <div class="container">

        <div class="box rgb">
            RGB
        </div>

        <div class="box rgba">
            RGBA
        </div>

        <div class="box hsl">
            HSL
        </div>

        <div class="box hsla">
            HSLA
        </div>

    </div>

</body>
</html>
